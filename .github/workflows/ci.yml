name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pmo-modern
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pmo-modern/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          # placeholder — schema é validado em prisma generate; build não conecta ao DB
          DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
